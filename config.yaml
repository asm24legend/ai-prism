# ---- data ----
csv_path: data/PRISM_LUAD_Dataset_-_Sheet1.csv
reports_file: data/TCGA_Reports.xlsx
text_col: text
key_col: patient_filename
min_chars: 100

# ---- run ----
output_dir: runs/exp2_finetune
seed: 42
n_folds: 5

# ---- model ----
model_name: Simonlee711/Clinical_ModernBERT
max_len: 2048
pooling: mean
head_hidden: 128
dropout: 0.2
grad_ckpt: true

# ---- loss ----
loss: bce
pos_weight: true
gamma_pos: 0.0
gamma_neg: 4.0
margin: 0.05

# ---- training ----
batch_size: 1
eval_batch_size: 1
grad_accum: 16
weight_decay: 0.01
warmup: 0.1
max_grad_norm: 1.0
patience: 4
lr_head: 0.0005
lr_encoder: 0.00002
phase1_epochs: 3
phase2_epochs: 10
unfreeze_layers: 6
keep_ckpt: false